name: Compilar APK y API
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TIENE_CLAVES: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        working-directory: Android
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK de depuracion
        working-directory: Android
        run: ./gradlew assembleDebug

      - name: Preparar firma y claves (solo si existen los secretos)
        if: env.TIENE_CLAVES == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sabortico.jks"
          {
            echo "api.base.url=http://10.0.2.2:5080/"
            echo "aes.key.base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
            echo "keystore.file=$RUNNER_TEMP/sabortico.jks"
            echo "keystore.password=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "key.alias=sabortico"
            echo "key.password=${{ secrets.KEYSTORE_PASSWORD }}"
          } > Android/local.properties

      - name: Compilar APK de produccion firmado
        if: env.TIENE_CLAVES == 'true'
        working-directory: Android
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            Android/app/build/outputs/apk/debug/app-debug.apk
            Android/app/build/outputs/apk/release/app-release.apk

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar la Web API
        working-directory: Web
        run: dotnet build TheMonkeyStore.Movil.sln -c Release
