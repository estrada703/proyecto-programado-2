plugins {
    id 'com.android.application'
}

// Los secretos viven en local.properties (no se sube a GitHub) y se leen con BuildConfig.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'cr.ac.monkeystore.movil'
    compileSdk 35

    defaultConfig {
        applicationId 'cr.ac.monkeystore.movil'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'API_BASE_URL',
                "\"${localProps.getProperty('api.base.url', 'http://10.0.2.2:5080/')}\""
        buildConfigField 'String', 'AES_KEY_BASE64',
                "\"${localProps.getProperty('aes.key.base64', '')}\""
    }

    signingConfigs {
        release {
            if (localProps.getProperty('keystore.file')) {
                storeFile file(localProps.getProperty('keystore.file'))
                storePassword localProps.getProperty('keystore.password')
                keyAlias localProps.getProperty('key.alias')
                keyPassword localProps.getProperty('key.password')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (localProps.getProperty('keystore.file')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
